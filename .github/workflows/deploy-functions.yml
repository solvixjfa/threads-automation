name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy threads-oauth-start --no-verify-jwt --project-ref xtarsaurwclktwhhryas
          supabase functions deploy threads-oauth-callback --no-verify-jwt --project-ref xtarsaurwclktwhhryas
          supabase functions deploy threads-webhook --no-verify-jwt --project-ref xtarsaurwclktwhhryas
