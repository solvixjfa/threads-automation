name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy threads-oauth-start --no-verify-jwt --project-ref xtarsaurwclktwhhryas
          npx supabase functions deploy threads-oauth-callback --no-verify-jwt --project-ref xtarsaurwclktwhhryas
          npx supabase functions deploy threads-webhook --no-verify-jwt --project-ref xtarsaurwclktwhhryas
